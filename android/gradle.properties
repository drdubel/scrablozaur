org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs to build the engine for. The A52 and every phone since ~2017 is
# arm64-v8a; add x86_64 for the emulator: -Pscrablozaur.abis=arm64-v8a,x86_64
scrablozaur.abis=arm64-v8a
# The rustup toolchain that has the Android targets installed. Homebrew's rustc
# has none, so the build puts rustup's proxies first on PATH.
scrablozaur.rustToolchain=1.99.1
scrablozaur.rustupBin=/opt/homebrew/opt/rustup/bin
